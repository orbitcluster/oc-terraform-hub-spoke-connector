apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: orbit-folder-dev-pr
  namespace: ${argocd_namespace}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # The Matrix generator combines parameters from multiple child generators.
    # It acts as a Cartesian Product: (Generator A) x (Generator B).
    # Here, we have a nested Matrix structure to handle: (Clusters x Repos) x PullRequests.
    - matrix:
        generators:
          # Inner Matrix: First, find all valid combinations of (Target Clusters * Repositories)
          # Result: List of {cluster-name, cluster-server, repository-name, repository-url}
          - matrix:
              generators:
                # 1a. Target dev clusters
                - clusters:
                    selector:
                      matchLabels:
                        environment: dev
                # 1b. Discover repos with topic
                - scmProvider:
                    github:
                      organization: ${github_org}
                      tokenRef:
                        secretName: github-token
                        key: token
                    filters:
                      - repositoryMatch: ".*"
                        pathsExist: [helm/envs/dev/values.yaml]
                        labelMatch: ${github_app_topic}
                    cloneProtocol: https
          # Outer Generator 2: Get open PRs for discovered repos
          - pullRequest:
              github:
                owner: ${github_org}
                repo: "{{.url | base | trimSuffix \".git\"}}"
                tokenRef:
                  secretName: github-token
                  key: token
              requeueAfterSeconds: 60
  template:
    metadata:
      name: '{{.repository}}-pr-{{.branch_slug}}'
      labels:
        env: dev
        type: pr
        branch: '{{.branch_slug}}'
      annotations:
        # Enable ArgoCD Image Updater for PRs
        argocd-image-updater.argoproj.io/image-list: app=~
        argocd-image-updater.argoproj.io/app.update-strategy: latest
        # Match PR specific tags: v{semver}-{branch}-{sha}
        # This regex ensures we only pick up images built for THIS specific branch.
        # It prevents PR A from accidentally auto-updating to PR B's image just because B is newer.
        argocd-image-updater.argoproj.io/app.allow-tags: 'regexp:^v[0-9]+\.[0-9]+\.[0-9]+-{{.branch_slug}}-.*$'
        argocd-image-updater.argoproj.io/write-back-method: git
        argocd-image-updater.argoproj.io/app.helm.image-name: 'k8s-service.containerImage.repository'
        argocd-image-updater.argoproj.io/app.helm.image-tag: 'k8s-service.containerImage.tag'
    spec:
      project: default
      source:
        repoURL: "{{.url}}"
        targetRevision: "{{.head_sha}}"
        path: "helm"
        helm:
          valueFiles:
            - values.yaml
            - envs/dev/values.yaml
          parameters:
            - name: "k8s-service.containerImage.repository"
              value: "{{.repository}}"
      destination:
        server: "{{.server}}"
        namespace: '{{.repository}}-pr-{{.branch_slug}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            istio-injection: enabled
            allow-hub-ecr-pull: "true"
