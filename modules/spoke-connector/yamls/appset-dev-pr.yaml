apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: orbit-folder-dev-pr
  namespace: ${argocd_namespace}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # The Matrix generator combines parameters from multiple child generators.
    # It acts as a Cartesian Product: (Generator A) x (Generator B).
    # Here, we have a nested Matrix structure to handle: (Clusters x Repos) x PullRequests.
    - matrix:
        generators:
          # Inner Matrix: First, find all valid combinations of (Target Clusters * Repositories)
          # Result: List of {cluster-name, cluster-server, repository-name, repository-url}
          - matrix:
              generators:
                # 1a. Target dev clusters
                - clusters:
                    selector:
                      matchLabels:
                        environment: dev
                # 1b. Discover repos with topic
                - scmProvider:
                    github:
                      organization: ${github_org}
                      tokenRef:
                        secretName: github-token
                        key: token
                    filters:
                      - repositoryMatch: ".*"
                        pathsExist: [helm/envs/dev/values.yaml]
                        labelMatch: ${github_app_topic}
                    cloneProtocol: https
          # Outer Generator 2: Get open PRs for discovered repos
          - pullRequest:
              github:
                owner: ${github_org}
                repo: '{{.url | base | trimSuffix ".git"}}' # Get the repository name from the URL by removing the .git suffix
                tokenRef:
                  secretName: github-token
                  key: token
              requeueAfterSeconds: 60
  template:
    metadata:
      name: "{{.repository}}-pr-{{.branch_slug}}"
      labels:
        env: dev
        type: pr
        branch: "{{.branch_slug}}"
      annotations:
        # PR images are dynamically constructed using branch slug and short sha
        # bypassing Image Updater entirely for PR ApplicationSets.
    spec:
      project: default
      source:
        repoURL: "{{.url}}"
        targetRevision: "{{.head_sha}}"
        path: "helm"
        helm:
          valueFiles:
            - values.yaml
            - envs/dev/values.yaml
          parameters:
            - name: "k8s-service.containerImage.repository"
              value: "{{.repository}}"
            - name: "k8s-service.containerImage.tag"
              value: "{{.branch_slug}}-{{.head_short_sha}}"
      destination:
        server: "{{.server}}"
        namespace: "{{.repository}}-pr-{{.branch_slug}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            istio-injection: enabled
            allow-hub-ecr-pull: "true"
            app.kubernetes.io/instance: "{{.repository}}-pr-{{.branch_slug}}"
          annotations:
            argocd.argoproj.io/tracking-id: "{{.repository}}-pr-{{.branch_slug}}:/Namespace:{{.repository}}-pr-{{.branch_slug}}"
