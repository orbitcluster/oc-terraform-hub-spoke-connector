apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: orbit-folder-dev-pr
  namespace: ${argocd_namespace}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          # The GitHub organization and repo to check.
          # Here we scan all repos in the org that match the labels,
          # or you can restrict to specific repos.
          organization: ${github_org}
          # Optional: Filter by topic like we did before
          # labels:
          #   - ${github_app_topic}
          tokenRef:
            secretName: github-token
            key: token
        requeueAfterSeconds: 60
  template:
    metadata:
      name: "{{.repository}}-{{.branch}}-dev"
      labels:
        orbit/env: dev
        orbit/type: pr
    spec:
      project: default
      source:
        repoURL: "{{.url}}"
        targetRevision: "{{.branch}}"
        path: "."
        helm:
          valueFiles:
            - values.yaml
            - env/dev/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.repository}}-{{.branch}}-dev"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
