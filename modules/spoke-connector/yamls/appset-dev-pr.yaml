apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: orbit-folder-dev-pr
  namespace: ${argocd_namespace}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # Outer Generator 1: Inner matrix (clusters × repos)
          - matrix:
              generators:
                # 1a. Target dev clusters
                - clusters:
                    selector:
                      matchLabels:
                        environment: dev
                # 1b. Discover repos with topic
                - scmProvider:
                    github:
                      organization: ${github_org}
                      tokenRef:
                        secretName: github-token
                        key: token
                    filters:
                      - repositoryMatch: ".*"
                        pathsExist: [env/dev/values.yaml]
                        labelMatch: ${github_app_topic}
                    cloneProtocol: https
          # Outer Generator 2: Get open PRs for discovered repos
          - pullRequest:
              github:
                owner: ${github_org}
                repo: "{{.repository}}"
                tokenRef:
                  secretName: github-token
                  key: token
              requeueAfterSeconds: 60
  template:
    metadata:
      name: '{{.repository}}-pr-{{.branch | replace "/" "-" | trunc 20}}'
      labels:
        env: dev
        type: pr
        branch: '{{.branch | replace "/" "-" | trunc 20}}'
    spec:
      project: default
      source:
        repoURL: "{{.url}}"
        targetRevision: "{{.branch}}"
        path: "."
        helm:
          valueFiles:
            - values.yaml
            - env/dev/values.yaml
      destination:
        server: "{{.server}}"
        namespace: '{{.repository}}-pr-{{.branch | replace "/" "-" | trunc 20}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            istio-injection: enabled
