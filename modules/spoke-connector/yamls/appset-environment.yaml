apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: orbit-apps-${environment}
  namespace: ${argocd_namespace}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # Generator 1: Discover spoke clusters for this environment
          - clusters:
              selector:
                matchLabels:
                  environment: ${environment}
          # Generator 2: Discover repos with the topic
          - scmProvider:
              github:
                organization: ${github_org}
                tokenRef:
                  secretName: github-token
                  key: token
              filters:
                - repositoryMatch: ".*"
                  pathsExist:
                    - helm/Chart.yaml
                  labelMatch: ${github_app_topic}
              cloneProtocol: https
  template:
    metadata:
      name: "{{.repository}}-${environment}"
      labels:
        app.kubernetes.io/name: "{{.repository}}"
        orbit.cluster/environment: "${environment}"
        orbit.cluster/repo: "{{.repository}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: helm
    spec:
      project: default
      source:
        repoURL: "{{.url}}"
        targetRevision: main
        path: helm
        helm:
          valueFiles:
            - values.yaml
            - values-${environment}.yaml
      destination:
        server: "{{.server}}"
        namespace: "{{.repository}}"
%{ if auto_sync ~}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
%{ else ~}
      # Prod: Manual sync required - no automated sync policy
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
%{ endif ~}
