apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: orbit-apps-pr-preview
  namespace: ${argocd_namespace}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # Target dev cluster for PR previews
          - clusters:
              selector:
                matchLabels:
                  environment: dev
          # Discover open PRs from repos with topic
          - scmProvider:
              github:
                organization: ${github_org}
                tokenRef:
                  secretName: github-token
                  key: token
              filters:
                - repositoryMatch: ".*"
                  pathsExist:
                    - helm/Chart.yaml
                  labelMatch: ${github_app_topic}
              cloneProtocol: https
  template:
    metadata:
      name: "{{.repository}}-pr-{{.branch | replace \"/\" \"-\"}}"
      labels:
        app.kubernetes.io/name: "{{.repository}}"
        orbit.cluster/preview: "true"
        orbit.cluster/branch: "{{.branch | replace \"/\" \"-\"}}"
      annotations:
        # Notifications for PR status
        notifications.argoproj.io/subscribe.on-sync-succeeded.github: ""
        notifications.argoproj.io/subscribe.on-sync-failed.github: ""
    spec:
      project: default
      source:
        repoURL: "{{.url}}"
        targetRevision: "{{.branch}}"
        path: helm
        helm:
          valueFiles:
            - values.yaml
            - values-dev.yaml
          parameters:
            - name: nameOverride
              value: "{{.repository}}-pr"
            - name: fullnameOverride
              value: "{{.repository}}-pr-{{.branch | replace \"/\" \"-\" | trunc 20}}"
      destination:
        server: "{{.server}}"
        namespace: "{{.repository}}-pr-{{.branch | replace \"/\" \"-\" | trunc 20}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
