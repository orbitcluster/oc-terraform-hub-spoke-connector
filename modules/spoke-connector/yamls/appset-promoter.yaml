apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: orbit-folder-promoter
  namespace: ${argocd_namespace}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # 1. List environments (QA, Prod)
          - list:
              elements:
                - env: qa
                - env: prod
          # 2. Target clusters matching the environment
          - clusters:
              selector:
                matchLabels:
                  environment: "{{.env}}"
          # 3. Discover repos with topic
          - scmProvider:
              github:
                organization: ${github_org}
                tokenRef:
                  secretName: github-token
                  key: token
              filters:
                - repositoryMatch: ".*"
                  labelMatch: ${github_app_topic}
  template:
    metadata:
      name: "{{.repository}}-main-{{.env}}"
      labels:
        env: "{{.env}}"
        type: stable
    spec:
      project: default
      source:
        repoURL: "{{.url}}"
        targetRevision: "main"
        path: "."
        helm:
          valueFiles:
            - values.yaml
            - env/{{.env}}/values.yaml
      destination:
        server: "{{.server}}"
        namespace: "{{.repository}}-main-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            istio-injection: enabled
